<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Myntra Clone Project</title>
    <link rel="stylesheet" href="index.css" />
    <!--  start search icon link  from google fonts  -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=search"
    />
    <!--  end search icon link  from google fonts  -->

    <!-- start link for icon from font awsome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <!--  link for icon from font awsome -->
  </head>
  <body>
    <!-- starting of header -->
    <header>
      <!-- logo section -->
      <div class="logo_container">
        <a href="#"
          ><img class="myntra_home" src="img/myntra-logo.png" alt="Myntra Home"
        /></a>
      </div>

      <!-- nav section -->
      <div class="nav_bar">
        <a href="#">Man</a>
        <a href="#">Women</a>
        <a href="#">Kids</a>
        <a href="#">Home&Living</a>
        <a href="#">Beauty</a>
        <a href="#">Studio<sup>New</sup></a>
      </div>

      <!-- search bar section -->
      <div class="search_bar">
        <span class="material-symbols-outlined search_icon"> search </span>
        <input
          class="search_input"
          placeholder="Search for products, brand and more"
        />
      </div>

      <!-- Action Section -->
      <div class="action_bar">
        <!-- profile -->
        <div class="action_container">
          <i class="fa-regular fa-user action_icon"></i>
          <span class="icon_name">Profile</span>
        </div>

        <!-- Wishlist -->
        <div class="action_container">
          <i class="fa-regular fa-heart action_icon"></i>
          <span class="icon_name">Wishlist</span>
        </div>

        <!-- Bag -->
        <div class="action_container">
          <i class="fa-solid fa-bag-shopping action_icon"></i>
          <span class="icon_name">Bag</span>
        </div>
      </div>
    </header>
    <!-- ending of header -->

    <!-- starting of main section -->
    <main>
      <!-- starting of banner section -->
      <div class="banner_container"></div>
      <img class="banner_img" src="img/banner.webp" alt="" />
      <div class="category_heading">medal worthy brand to bag</div>
       <!-- ending of banner section -->

        <!-- starting of  MEDAL WORTHY BRANDS TO BAG-->
      <div class="category_items">
        <a href="#"><img class="sale_item" src="img/offers/img1.png" /></a>
        <a href="#"><img class="sale_item" src="img/offers/img2.png" /></a>
        <a href="#"><img class="sale_item" src="img/offers/img3.png" /></a>
        <a href="#"><img class="sale_item" src="img/offers/img4.png" /></a>
        <a href="#"><img class="sale_item" src="img/offers/img5.png" /></a>
        <a href="#"><img class="sale_item" src="img/offers/img6.png" /></a>
        <a href="#"><img class="sale_item" src="img/offers/img7.png" /></a>
        <a href="#"><img class="sale_item" src="img/offers/img8.png" /></a>
        <a href="#"><img class="sale_item" src="img/offers/img9.png" /></a>
        <a href="#"><img class="sale_item" src="img/offers/img10.png" /></a>
        <a href="#"><img class="sale_item" src="img/offers/img11.png" /></a>
       <!-- ending of  MEDAL WORTHY BRANDS TO BAG-->
   
       <!-- starting of  SHOP BY CATEGORY  -->

       <div class="category_items">
        <a href="#"><img class="sale_item" src="img/categories/img1.jpg" /></a>
        <a href="#"><img class="sale_item" src="img/categories/img2.jpg" /></a>
        <a href="#"><img class="sale_item" src="img/categories/img3.jpg" /></a>
        <a href="#"><img class="sale_item" src="img/categories/img4.jpg" /></a>
        <a href="#"><img class="sale_item" src="img/categories/img5.jpg" /></a>
        <a href="#"><img class="sale_item" src="img/categories/img6.jpg" /></a>
        <a href="#"><img class="sale_item" src="img/categories/img7.jpg" /></a>
        <a href="#"><img class="sale_item" src="img/categories/img8.jpg" /></a>
        <a href="#"><img class="sale_item" src="img/categories/img9.jpg" /></a>
        <a href="#"><img class="sale_item" src="img/categories/img10.jpg" /></a>
     
        <!-- ending of SHOP BY CATEGORY -->
        
    </main>
    <!-- end of main section -->

    <!-- starting of  footer section -->
    <footer>Footer</footer>
    <!-- ending of  footer section -->
  </body>
</html>
